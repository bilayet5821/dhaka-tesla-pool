server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass https://dhaka-tesla-pool-bzs2.onrender.com;

    proxy_ssl_server_name on;
    proxy_ssl_name dhaka-tesla-pool-bzs2.onrender.com;

    proxy_set_header Host dhaka-tesla-pool-bzs2.onrender.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}