name: Auth checks

on:
  push:
    branches: [feature/auth]
  pull_request:
    branches: [master]

jobs:
  auth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: auth_test
          POSTGRES_HOST_AUTH_METHOD: trust # disposable CI service only; never use in deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auth_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/auth_test
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/auth_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
